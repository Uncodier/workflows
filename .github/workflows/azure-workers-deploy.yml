# Deploy Temporal workers to AKS (production path).
# Secrets required:
#   AZURE_CREDENTIALS — service principal JSON for azure/login
#     { clientId, clientSecret, subscriptionId, tenantId }

name: Deploy Azure Temporal Workers

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'worker.tsconfig.json'
      - 'infra/azure/workers/**'
      - '.github/workflows/azure-workers-deploy.yml'
  workflow_dispatch:

concurrency:
  group: azure-workers-prod
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  AKS_NAME: uncodie-tmp-aks
  ACR_NAME: uncodietmpacr
  RG_NAME: rg-temporal-prod

jobs:
  deploy-aks-workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require AZURE_CREDENTIALS
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -z "${AZURE_CREDENTIALS}" ]; then
            echo "::error::AZURE_CREDENTIALS is not set. Add the service principal JSON in GitHub Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck worker
        run: node ./node_modules/typescript/bin/tsc --project worker.tsconfig.json --noEmit

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          LOGIN_SERVER="$(az acr show -n "${ACR_NAME}" --query loginServer -o tsv)"
          TOKEN="$(az acr login -n "${ACR_NAME}" --expose-token --query accessToken -o tsv)"
          echo "${TOKEN}" | docker login "${LOGIN_SERVER}" -u 00000000-0000-0000-0000-000000000000 --password-stdin
          echo "LOGIN_SERVER=${LOGIN_SERVER}" >> "${GITHUB_ENV}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/azure/workers/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.LOGIN_SERVER }}/temporal-worker:${{ github.sha }}
            ${{ env.LOGIN_SERVER }}/temporal-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup kubelogin
        uses: azure/use-kubelogin@v1
        with:
          # Pin a release so the action does not need GITHUB_TOKEN to resolve "latest"
          kubelogin-version: 'v0.2.12'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            -g "${RG_NAME}" \
            -n "${AKS_NAME}" \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Roll out worker deployments
        run: |
          set -euo pipefail
          IMAGE="${LOGIN_SERVER}/temporal-worker:${GITHUB_SHA}"
          echo "Deploying ${IMAGE}"

          DEPLOYS=(
            temporal-worker-default
            temporal-worker-critical
            temporal-worker-high
            temporal-worker-low
            temporal-worker-background
            temporal-worker-validation
          )

          for deploy in "${DEPLOYS[@]}"; do
            kubectl -n temporal-workers get "deploy/${deploy}" >/dev/null
            echo "Setting image for ${deploy}..."
            kubectl -n temporal-workers set image "deploy/${deploy}" "worker=${IMAGE}"
          done

          pids=()
          for deploy in "${DEPLOYS[@]}"; do
            kubectl -n temporal-workers rollout status "deploy/${deploy}" --timeout=5m &
            pids+=("$!")
          done

          fail=0
          for pid in "${pids[@]}"; do
            if ! wait "${pid}"; then
              fail=1
            fi
          done
          if [ "${fail}" -ne 0 ]; then
            echo "::error::One or more worker rollouts failed"
            kubectl -n temporal-workers get pods -o wide
            exit 1
          fi

          kubectl -n temporal-workers get pods -o wide
