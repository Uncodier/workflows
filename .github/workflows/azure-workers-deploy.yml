# Deploy Temporal workers to AKS (production path).
# App Service workers are not used. Secrets required:
#   AZURE_CREDENTIALS     — service principal JSON for azure/login
#   AZURE_RESOURCE_GROUP  — resource group (rg-temporal-prod)

name: Deploy Azure Temporal Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AKS_NAME: uncodie-tmp-aks
  ACR_NAME: uncodietmpacr

jobs:
  deploy-aks-workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build worker image in ACR
        run: |
          az acr build \
            -r "${ACR_NAME}" \
            -t "temporal-worker:${GITHUB_SHA}" \
            -t "temporal-worker:latest" \
            -f infra/azure/workers/Dockerfile \
            .

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            -g "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            -n "${AKS_NAME}" \
            --overwrite-existing

      - name: Roll out worker deployments
        run: |
          LOGIN_SERVER="$(az acr show -n "${ACR_NAME}" --query loginServer -o tsv)"
          IMAGE="${LOGIN_SERVER}/temporal-worker:${GITHUB_SHA}"
          echo "Deploying ${IMAGE}"

          if ! kubectl -n temporal-workers get deploy temporal-worker-validation >/dev/null 2>&1; then
            kubectl -n temporal-workers get deploy temporal-worker-default -o yaml \
              | sed \
                -e 's/temporal-worker-default/temporal-worker-validation/g' \
                -e 's/queue: default/queue: validation/g' \
                -e 's/value: default/value: validation/g' \
              | kubectl apply -f -
          fi

          for deploy in temporal-worker-default temporal-worker-critical temporal-worker-high temporal-worker-low temporal-worker-background temporal-worker-validation; do
            kubectl -n temporal-workers set image "deploy/${deploy}" "worker=${IMAGE}"
            kubectl -n temporal-workers rollout status "deploy/${deploy}" --timeout=5m
          done

          kubectl -n temporal-workers get pods -o wide
