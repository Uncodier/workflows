apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-grpc-gateway
  namespace: temporal
  labels:
    app: temporal-grpc-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: temporal-grpc-gateway
  template:
    metadata:
      labels:
        app: temporal-grpc-gateway
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.31.5
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/envoy/envoy.yaml"
            - "--log-level"
            - info
          ports:
            - name: grpc-tls
              containerPort: 7233
            - name: admin
              containerPort: 9901
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
            - name: tls
              mountPath: /etc/tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: envoy-config
          secret:
            secretName: temporal-gateway-envoy
        - name: tls
          secret:
            secretName: temporal-gateway-tls
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-grpc-gateway
  namespace: temporal
  labels:
    app: temporal-grpc-gateway
spec:
  selector:
    app: temporal-grpc-gateway
  ports:
    - name: grpc-tls
      port: 7233
      targetPort: grpc-tls
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-grpc-gateway
  namespace: temporal
spec:
  podSelector:
    matchLabels:
      app: temporal-grpc-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 7233
  egress:
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 7233
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-gateway-reloader
  namespace: temporal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: temporal-gateway-reloader
  namespace: temporal
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["temporal-grpc-gateway"]
    verbs: ["get", "patch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: temporal-gateway-reloader
  namespace: temporal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: temporal-gateway-reloader
subjects:
  - kind: ServiceAccount
    name: temporal-gateway-reloader
    namespace: temporal
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: temporal-gateway-cert-reload
  namespace: temporal
spec:
  schedule: "0 4 * * 1"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: temporal-gateway-reloader
          containers:
            - name: restart
              image: bitnami/kubectl:1.31
              command:
                - kubectl
                - -n
                - temporal
                - rollout
                - restart
                - deploy/temporal-grpc-gateway
