apiVersion: v1
kind: Namespace
metadata:
  name: temporal-workers
---
apiVersion: v1
kind: Secret
metadata:
  name: worker-env
  namespace: temporal-workers
type: Opaque
stringData:
  TEMPORAL_SERVER_URL: "temporal-frontend.temporal.svc.cluster.local:7233"
  TEMPORAL_NAMESPACE: "default"
  TEMPORAL_TLS: "false"
  NODE_ENV: "production"
  # Filled by deploy script (placeholders replaced or patched)
  API_BASE_URL: "__API_BASE_URL__"
  API_KEY: "__API_KEY__"
  SUPABASE_URL: "__SUPABASE_URL__"
  SUPABASE_KEY: "__SUPABASE_ANON_KEY__"
  SUPABASE_ANON_KEY: "__SUPABASE_ANON_KEY__"
  SUPABASE_SERVICE_ROLE_KEY: "__SUPABASE_SERVICE_ROLE_KEY__"
  REOON_API_KEY: "__REOON_API_KEY__"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-worker-default
  namespace: temporal-workers
  labels:
    app: temporal-worker
    queue: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: temporal-worker
      queue: default
  template:
    metadata:
      labels:
        app: temporal-worker
        queue: default
    spec:
      containers:
        - name: worker
          image: __WORKER_IMAGE__
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: worker-env
          env:
            - name: WORKFLOW_TASK_QUEUE
              value: default
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: health
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: apps/v1
